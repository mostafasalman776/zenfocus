# ZenFocus vhost (template; deploy/setup.sh fills the __PLACEHOLDERS__).
# Traffic arrives through Cloudflare (proxied, SSL mode Full).
server {
    listen 80;
    listen 443 ssl;
    server_name __DOMAIN__;

    ssl_certificate __APP_DIR__/deploy/ssl/server.crt;
    ssl_certificate_key __APP_DIR__/deploy/ssl/server.key;

    client_max_body_size 12M;
    root __APP_DIR__/apps/web/dist;
    index index.html;

    access_log /www/wwwlogs/__DOMAIN__.log;
    error_log /www/wwwlogs/__DOMAIN__.error.log;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Realtime (Socket.io websockets).
    location /api/socket.io/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Chat images: the API checks the signed URL, then Nginx sends the file.
    location /_zf_uploads/ {
        internal;
        alias __APP_DIR__/apps/api/uploads/;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
